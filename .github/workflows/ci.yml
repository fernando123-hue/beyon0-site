# CI da Beyon Zero (auditoria do Harness, 2026-10-07): o portão que faltava entre o código e a produção.
# Grátis: GitHub Actions em repositório privado (cota mensal do plano gratuito). Padrão endurecido do SBP:
# permissões mínimas, actions fixadas por SHA, nada de credencial persistida, texto externo só por env.
# A produção NÃO sai daqui: a Vercel não publica a main sozinha (vercel.json → git.deploymentEnabled) e o dono
# promove no painel depois de ler estes checks (docs/PROCESSO.md).
name: CI

# Repositório PRIVADO desde 14/11/2026 (dono): ~2.000 min/mês no plano gratuito. Para caber (Decisões 14/11):
# - o push só roda na main e nos ramos de promoção parcial (producao-*); ramo de trabalho roda pelo PR, uma vez
#   só (antes o mesmo commit rodava duas vezes: pelo push e pelo PR);
# - a mutação roda só na main e à mão, em fatias paralelas; o PR roda a suíte inteira sem ela.
on:
  push:
    branches: [main, 'producao-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # na main não cancela: a mutação só roda lá (revisão do #161); nos outros ramos, o envio novo cancela o velho
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- "Testes (banco real, IA e pagamento simulados) e mutação" ----
  # O guarda e o gate de promoção leem este check POR NOME. Ele continua sendo UM check só, agora um AGREGADO (o job "testes",
  # mais abaixo) que espera a suíte e as fatias da mutação, que correm em paralelo, cada uma numa máquina (docs/PROCESSO.md).
  suite:
    name: Suíte de testes (npm run testar)
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ~6 min medidos (PR #204: 5m49s); a mutação saiu daqui e foi para as fatias
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run testar

  # a mutação: as sabotagens repartidas em N=8 fatias por revezamento de índice (MUTACAO_FATIA=i/N, docs/testes/mutacao.mjs).
  # Só na main e à mão (cota do repositório privado). Para mudar N: troque a lista abaixo E MUTACAO_FATIAS no agregado
  # (docs/testes/ci-paralela.test.mjs confere que as duas batem e que a lista é 1/N..N/N).
  mutacao:
    name: Mutação (fatia ${{ matrix.fatia }})
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false   # uma fatia vermelha não cancela as outras: o relatório sai completo
      matrix:
        fatia: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
        exclude:
          - fatia: '1/8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run testar:mutacao
        env:
          MUTACAO_FATIA: ${{ matrix.fatia }}

  testes:
    name: Testes (banco real, IA e pagamento simulados) e mutação
    # AGREGADO: roda sempre (if: always()), mesmo com a suíte ou uma fatia vermelha, cancelada ou pulada, e só passa se TUDO o que era
    # esperado deu success. Duas camadas: o resultado agregado de cada job e a contagem de cada fatia pelo nome (conferir-jobs.mjs),
    # porque o resultado agregado de uma matriz não conta quantas fatias existiram.
    needs: [suite, mutacao]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # só para ler os jobs desta execução (API do GitHub)
    env:
      SUITE: ${{ needs.suite.result }}
      MUTACAO: ${{ needs.mutacao.result }}
      MUTACAO_ESPERADA: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
      MUTACAO_FATIAS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Conferir que tudo o que era esperado passou
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          falhou=0
          echo "PROVA B: needs.mutacao.result = '$MUTACAO'"
          [ "$SUITE" = success ] || { echo "REPROVADO: a suíte terminou como '$SUITE', não success"; falhou=1; }
          if [ "$MUTACAO_ESPERADA" = true ]; then
            [ "$MUTACAO" = success ] || { echo "REPROVADO: a mutação terminou como '$MUTACAO', não success (fatia vermelha, cancelada ou pulada)"; falhou=1; }
            node scripts/ci/conferir-jobs.mjs --fatias "$MUTACAO_FATIAS" || falhou=1
          else
            # PR e push em ramo de promoção: a mutação não roda (cota); se rodou, tem de ter passado
            [ "$MUTACAO" = skipped ] || [ "$MUTACAO" = success ] || { echo "REPROVADO: a mutação terminou como '$MUTACAO'"; falhou=1; }
          fi
          exit $falhou

  segredos:
    name: Segredos no código (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # no PR, o gitleaks lista os commits do PR pela API ("Resource not accessible" sem isso)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # achado aparece no log do job; comentar no PR exigiria permissão de escrita

  dependencias:
    name: Dependências de produção (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  # ---- "E2E do orçamento (Chromium, do 1º texto ao projeto pago)" ----
  # Antes: as duas rodadas em série num job só (~19 min). Agora: uma máquina por rodada, em paralelo. Cada máquina tem o seu IP e o seu
  # servidor local, então o freio local de sessões por IP não passa de uma rodada para a outra (era o motivo do servidor novo entre elas).
  e2e-rodada:
    name: E2E do orçamento – ${{ matrix.modo }}
    # (pesado: só no PR para a main e à mão — o push comum roda os testes acima)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 11/11: a rodada serial levou 17 min (#131) e foi cancelada aos 20 (#130, parada na espera de 61 s do freio por IP); cada rodada agora roda sozinha
    strategy:
      fail-fast: false   # uma rodada vermelha não cancela a outra
      matrix:
        include:
          - modo: sem consultor
            consultor: '0'
          - modo: com consultor
            consultor: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # a chave do painel só deste job: o E2E confirma o pedido pelo painel, como o dono (gerada aqui, nunca no repositório).
      # Mascarada ANTES de ir ao GITHUB_ENV: o GitHub só esconde do log os segredos que conhece
      - name: Chave do painel para o E2E
        run: |
          CHAVE="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$CHAVE"
          echo "PAINEL_CHAVE=$CHAVE" >> "$GITHUB_ENV"
      # sem consultor (o modo de venda hoje): a página abre sem o consultor (BZ_SEM_CONSULTOR só vale com BZ_LOCAL);
      # com consultor (IA simulada): a conversa, o HTML que vira texto e as dúvidas no resumo e no sinal
      - name: Servidor local (banco PGlite, IA e Mercado Pago simulados)
        env:
          RODADA_COM_CONSULTOR: ${{ matrix.consultor }}
        run: |
          if [ "$RODADA_COM_CONSULTOR" = 0 ]; then export BZ_SEM_CONSULTOR=1; fi
          node docs/servidor.mjs . 8899 > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8899/orcamento > /dev/null && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - run: npm run e2e:orcamento
        env:
          BASE: http://127.0.0.1:8899
          CONSULTOR: ${{ matrix.consultor }}

  e2e:
    name: E2E do orçamento (Chromium, do 1º texto ao projeto pago)
    # AGREGADO das duas rodadas: só passa se as DUAS deram success (e existiram); SKIPPED no push comum, como sempre foi.
    needs: [e2e-rodada]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # só para ler os jobs desta execução (API do GitHub)
    env:
      RODADAS: ${{ needs.e2e-rodada.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Conferir que as duas rodadas passaram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          falhou=0
          [ "$RODADAS" = success ] || { echo "REPROVADO: as rodadas do E2E terminaram como '$RODADAS', não success"; falhou=1; }
          node scripts/ci/conferir-jobs.mjs "E2E do orçamento – sem consultor" "E2E do orçamento – com consultor" || falhou=1
          exit $falhou

  worker:
    name: Worker (workerd de verdade, sem publicar)
    # fumaça no mesmo motor da Cloudflare: empacota (--dry-run), sobe o Worker local SEM segredos (= produção sem chaves)
    # e confere o que tem de fechar. Nada é publicado: sem token, sem login, só leitura do repositório (docs/worker-fumaca.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run cf:fumaca
