# CI da Beyon Zero (auditoria do Harness, 2026-10-07): o portão que faltava entre o código e a produção.
# Grátis: GitHub Actions em repositório privado (cota mensal do plano gratuito). Padrão endurecido do SBP:
# permissões mínimas, actions fixadas por SHA, nada de credencial persistida, texto externo só por env.
# A produção NÃO sai daqui: a Vercel não publica a main sozinha (vercel.json → git.deploymentEnabled) e o dono
# promove no painel depois de ler estes checks (docs/PROCESSO.md).
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (banco real, IA e pagamento simulados) e mutação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run testar
      - run: npm run testar:mutacao

  segredos:
    name: Segredos no código (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # no PR, o gitleaks lista os commits do PR pela API ("Resource not accessible" sem isso)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # achado aparece no log do job; comentar no PR exigiria permissão de escrita

  dependencias:
    name: Dependências de produção (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E do orçamento (Chromium, do 1º texto ao projeto pago)
    # (pesado: só no PR para a main e à mão — o push comum roda os testes acima)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # a chave do painel só deste job: o E2E confirma o pedido pelo painel, como o dono (gerada aqui, nunca no repositório).
      # Mascarada ANTES de ir ao GITHUB_ENV: o GitHub só esconde do log os segredos que conhece
      - name: Chave do painel para o E2E
        run: |
          CHAVE="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$CHAVE"
          echo "PAINEL_CHAVE=$CHAVE" >> "$GITHUB_ENV"
      # o orçamento sem IA (o modo de venda hoje): a página abre sem o consultor (BZ_SEM_CONSULTOR só vale com BZ_LOCAL)
      - name: Servidor local sem consultor (banco PGlite, IA e Mercado Pago simulados)
        run: |
          BZ_SEM_CONSULTOR=1 node docs/servidor.mjs . 8899 > servidor.log 2>&1 &
          echo $! > servidor.pid
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8899/orcamento > /dev/null && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - run: npm run e2e:orcamento
        env:
          BASE: http://127.0.0.1:8899
      # com o consultor ligado (IA simulada): a conversa, o HTML que vira texto e as dúvidas no resumo e no sinal.
      # Servidor novo: o freio local de sessões por IP não passa de uma rodada para a outra
      - name: Servidor local com consultor
        run: |
          kill "$(cat servidor.pid)"; sleep 1
          node docs/servidor.mjs . 8899 > servidor-consultor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8899/orcamento > /dev/null && exit 0; sleep 1; done
          cat servidor-consultor.log; exit 1
      - run: npm run e2e:orcamento
        env:
          BASE: http://127.0.0.1:8899
          CONSULTOR: '1'

  worker:
    name: Worker (workerd de verdade, sem publicar)
    # fumaça no mesmo motor da Cloudflare: empacota (--dry-run), sobe o Worker local SEM segredos (= produção sem chaves)
    # e confere o que tem de fechar. Nada é publicado: sem token, sem login, só leitura do repositório (docs/worker-fumaca.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run cf:fumaca
