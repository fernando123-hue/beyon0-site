<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>og-render</title>
<style>
  /* as fontes do próprio site (assets/fonts), não do Google: sem internet a capa saía em fonte genérica */
  @font-face { font-family: Sora; src: url("../assets/fonts/sora-latin.woff2") format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
  /* NADA além do canvas: esta página existe só para ser fotografada por
     Chrome headless (--window-size=1200,630 --screenshot). Qualquer margem,
     padding ou segundo elemento vaza para dentro do PNG capturado. Ver
     docs/og-gerador.html para a versão com interface, usada manualmente. */
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
(function () {
  var W = 1200, H = 630;
  /* a paleta V4 (css/tokens.css): preto, ciano-esverdeado, texto e cinza de hoje */
  var BG = '#000000', LINE = '#1A1D1E', AC = '#49E5DD', T1 = '#F2F4F4', T3 = '#858C8C';
  var TAU = Math.PI * 2, LAMINAS = 6, K_HEX = 1 / Math.cos(Math.PI / LAMINAS);

  function desenhar(x) {
    x.fillStyle = BG; x.fillRect(0, 0, W, H);

    x.strokeStyle = LINE; x.lineWidth = 1; x.beginPath();
    for (var gx = 0; gx <= W; gx += 60) { x.moveTo(gx + .5, 0); x.lineTo(gx + .5, H); }
    for (var gy = 0; gy <= H; gy += 60) { x.moveTo(0, gy + .5); x.lineTo(W, gy + .5); }
    x.stroke();

    var cx = 935, cy = 315, R = 185;
    x.save(); x.globalCompositeOperation = 'lighter';

    x.strokeStyle = 'rgba(104,110,124,.20)'; x.lineWidth = 1; x.beginPath();
    var passo = R / 6;
    for (var i = -5; i <= 5; i++) {
      if (!i) continue;
      var d = i * passo, meia = Math.sqrt(Math.max(0, R * R - d * d));
      x.moveTo(cx + d, cy - meia); x.lineTo(cx + d, cy + meia);
      x.moveTo(cx - meia, cy + d); x.lineTo(cx + meia, cy + d);
    }
    x.stroke();

    x.strokeStyle = 'rgba(79,216,240,.34)';
    x.beginPath(); x.arc(cx, cy, R * .88, 0, TAU); x.stroke();
    x.strokeStyle = 'rgba(79,216,240,.75)'; x.lineWidth = 2; x.beginPath();
    [0, .25, .5, .75].forEach(function (f) {
      var a = f * TAU, ca = Math.cos(a), sa = Math.sin(a);
      x.moveTo(cx + ca * R * .82, cy + sa * R * .82);
      x.lineTo(cx + ca * R * .96, cy + sa * R * .96);
    });
    x.stroke();

    x.strokeStyle = 'rgba(165,235,246,.8)'; x.lineWidth = 2;
    x.beginPath(); x.arc(cx, cy, R * .88, -0.9, -0.52); x.stroke();

    var rIn = R * .34, rOut = rIn * K_HEX * 1.10;
    var meiaCorda = Math.sqrt(rOut * rOut - rIn * rIn);
    x.strokeStyle = 'rgba(79,216,240,.62)'; x.lineWidth = 1.5; x.beginPath();
    for (var l = 0; l < LAMINAS; l++) {
      var al = 0.35 + l / LAMINAS * TAU;
      var lx = cx + Math.cos(al) * rIn, ly = cy + Math.sin(al) * rIn;
      var ldx = -Math.sin(al) * meiaCorda, ldy = Math.cos(al) * meiaCorda;
      x.moveTo(lx - ldx, ly - ldy); x.lineTo(lx + ldx, ly + ldy);
    }
    x.stroke();

    x.strokeStyle = 'rgba(104,110,124,.35)'; x.lineWidth = 1; x.beginPath();
    x.moveTo(cx - R * .96, cy); x.lineTo(cx + R * .96, cy);
    x.moveTo(cx, cy - R * .96); x.lineTo(cx, cy + R * .96);
    x.stroke();

    /* o núcleo: ponto nítido com aro, sem halo (o dono proíbe brilho e desfoque) */
    x.strokeStyle = AC; x.lineWidth = 1.5; x.beginPath(); x.arc(cx, cy, 11, 0, TAU); x.stroke();
    x.fillStyle = T1; x.beginPath(); x.arc(cx, cy, 6, 0, TAU); x.fill();
    x.restore();

    var P = 76;
    x.textBaseline = 'alphabetic';
    x.font = '500 21px "JetBrains Mono", monospace';
    x.fillStyle = T1; x.fillText('Beyon ', P, 96);
    x.fillStyle = AC; x.fillText('Zero', P + x.measureText('Beyon ').width, 96);

    x.font = '300 60px Sora, sans-serif'; x.fillStyle = T1;
    /* duas linhas centradas no vão entre a marca (96) e a régua (505); eram três a partir de 250 */
    ['Do problema ao', 'sistema no ar.']
      .forEach(function (linha, n) { x.fillText(linha, P, 280 + n * 70); });

    x.strokeStyle = LINE; x.lineWidth = 1;
    x.beginPath(); x.moveTo(P, 505.5); x.lineTo(P + 560, 505.5); x.stroke();
    x.font = '400 17px "JetBrains Mono", monospace'; x.fillStyle = T3;
    x.fillText('SITES  ·  AUTOMAÇÃO  ·  IA', P, 545);

    document.title = 'pronto';   /* sinal pro --virtual-time-budget/polling */
  }

  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  /* o canvas não pede fonte sozinho: carrega as usadas antes de desenhar */
  var fontes = document.fonts ? Promise.all(['300 60px Sora', '500 21px "JetBrains Mono"', '400 17px "JetBrains Mono"'].map(function (q) { return document.fonts.load(q); })) : Promise.resolve();
  fontes.then(function () { desenhar(ctx); }, function () { desenhar(ctx); });
})();
</script>
</body>
</html>
