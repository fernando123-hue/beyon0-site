<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A ABERTURA — o mesmo mecanismo que o canvas desenha no hero, reduzido ao
       que sobrevive a 16px: o hexágono do diafragma e o ponto central.

       O favicon anterior desenhava um ".0" em #00F5FF: era a marca "beyon.0",
       nome que a empresa abandonou (o commit 19ea74e corrigiu o site inteiro
       para "Beyon Zero"), na paleta neon que a reformulação substituiu. Ficou
       duas identidades atrás do resto.

       Sem lâminas, sem anel de registro, sem malha: em 16px cada um desses
       vira sujeira. O que identifica é a silhueta hexagonal com o núcleo
       aceso. -->
  <rect width="64" height="64" rx="14" fill="#050507"/>
  <polygon points="46.7,40.5 32,49 17.3,40.5 17.3,23.5 32,15 46.7,23.5"
           fill="none" stroke="#49E5DD" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4" fill="#EDEDF1"/>
</svg>
